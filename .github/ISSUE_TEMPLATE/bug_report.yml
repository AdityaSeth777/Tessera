name: Bug report
description: Something broke, looks wrong, or exports don't match the editor
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems go in a private report instead**: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add three iPhone HEIC photos
        2. Pick the 4:5 format and Rounded tiles
        3. Export as JPEG Display P3 + HDR gain map
        4. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Importing media
        - Layout / editing
        - Video playback in the editor
        - Exporting a still
        - Exporting a video
        - Colors or HDR look wrong
        - Setup / start.sh
        - Other
    validations:
      required: true
  - type: input
    id: files
    attributes:
      label: Kind of files involved
      placeholder: "iPhone 15 Pro HEIC with HDR, MOV HLG video, PNG screenshot..."
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 26.1, MacBook Air M3"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Python and ffmpeg versions
      description: Output of `python3 --version` and the first line of `ffmpeg -version`.
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: From the terminal running start.sh, the browser console, or the export dialog.
      render: shell
  - type: markdown
    attributes:
      value: |
        If you can, attach a sample file that shows the problem. Only attach files you're happy to make public.

name: Feature request
description: Suggest something Tessera should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation or problem, not just the feature. For example, "I post collages to Instagram as carousels and have to split them by hand."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
  - type: checkboxes
    id: local
    attributes:
      label: Fits the project
      options:
        - label: This works without sending media or data off my machine.
          required: true
